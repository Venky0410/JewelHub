name: Deploy JewelHub to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: steadystackai-cluster

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    # Step 1 - Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2 - Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Step 3 - Login to ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # Step 4 - Build and push product service
    - name: Build and push product service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/jewelhub-product-service:latest ./product-service
        docker push $ECR_REGISTRY/jewelhub-product-service:latest

    # Step 5 - Build and push cart service
    - name: Build and push cart service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/jewelhub-cart-service:latest ./cart-service
        docker push $ECR_REGISTRY/jewelhub-cart-service:latest

    # Step 6 - Build and push order service
    - name: Build and push order service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/jewelhub-order-service:latest ./order-service
        docker push $ECR_REGISTRY/jewelhub-order-service:latest

    # Step 7 - Build and push user service
    - name: Build and push user service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/jewelhub-user-service:latest ./user-service
        docker push $ECR_REGISTRY/jewelhub-user-service:latest

    # Step 8 - Build and push notification service
    - name: Build and push notification service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/jewelhub-notification-service:latest ./notification-service
        docker push $ECR_REGISTRY/jewelhub-notification-service:latest

    # Step 9 - Build and push frontend
    - name: Build and push frontend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/jewelhub-frontend:latest ./frontend
        docker push $ECR_REGISTRY/jewelhub-frontend:latest

    # Step 10 - Connect to EKS
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.EKS_CLUSTER }}

    # Step 11 - Deploy to EKS
    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Replace ACCOUNT_ID in manifests
        find ./k8s -name "*.yaml" | xargs sed -i \
          "s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g"

        # Apply all manifests
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/product-service/
        kubectl apply -f k8s/cart-service/
        kubectl apply -f k8s/order-service/
        kubectl apply -f k8s/user-service/
        kubectl apply -f k8s/notification-service/
        kubectl apply -f k8s/frontend/

    # Step 12 - Verify deployment
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/frontend -n jewelhub
        kubectl rollout status deployment/product-service -n jewelhub
        kubectl rollout status deployment/cart-service -n jewelhub
        echo "✅ JewelHub deployed successfully!"

    # Step 13 - Get live URL
    - name: Get JewelHub URL
      run: |
        echo "🌍 JewelHub URL:"
        kubectl get svc frontend -n jewelhub \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'