apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jewelhub
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/jewelhub-frontend:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:5001"
        - name: CART_SERVICE_URL
          value: "http://cart-service:5002"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:5003"
        - name: USER_SERVICE_URL
          value: "http://user-service:5004"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:5005"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5